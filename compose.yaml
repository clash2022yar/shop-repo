services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    restart: unless-stopped
  web:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
